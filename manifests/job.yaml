apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-group-client-job
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: client
          image: cluster-group-client:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cluster-group-client-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
